<form class="form @@class">
  <label class="form__field">
    <span class="form__label">Имя<span class="form__req">*</span></span>
    <input class="form__input" type="text" name="name" placeholder="Введите ваше имя" autocomplete="name" required>
  </label>
  <label class="form__field">
    <span class="form__label">Номер телефона<span class="form__req">*</span></span>
    <input class="form__input" type="tel" name="phone" placeholder="+7 (___) ___-__-__" data-mask="+7 (___) ___-__-__" autocomplete="tel" required>
  </label>
  <label class="form__field">
    <span class="form__label">E-mail<span class="form__req">*</span></span>
    <input class="form__input" type="email" name="email" placeholder="mail@example.com" autocomplete="email" required>
  </label>
  <label class="form__field">
    <span class="form__label">Сообщение</span>
    <textarea class="form__input form__input--area" name="message" placeholder="Опишите вашу задачу или задайте вопрос"></textarea>
  </label>
  @@include('form-consent.html')
  <input type="hidden" name="topic" value="@@topic" data-modal-topic>
  <button class="button button--accent form__btn" type="submit">Отправить заявку</button>
</form>
