<div class="project-card">
  <span class="project-card__hatch" aria-hidden="true"></span>
  <h3 class="project-card__title">@@title</h3>
  <p class="project-card__text">@@text</p>
  <dl class="project-card__meta">
    <div class="project-card__meta-item">
      <dt class="project-card__label">Отрасль</dt>
      <dd class="project-card__value">@@industry</dd>
    </div>
    <div class="project-card__meta-item">
      <dt class="project-card__label">Направление</dt>
      <dd class="project-card__value">@@direction</dd>
    </div>
  </dl>
  <a class="project-card__link" href="@@href" aria-label="Читать подробнее: @@title">Читать подробнее</a>
</div>
