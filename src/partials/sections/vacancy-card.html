<div class="vacancy-card">
  <span class="brackets brackets--diagonal" aria-hidden="true"></span>
  <h3 class="vacancy-card__title">@@title</h3>
  <p class="vacancy-card__text">@@text</p>
  <dl class="vacancy-card__meta">
    <div class="vacancy-card__meta-item">
      <dt class="vacancy-card__label">Город</dt>
      <dd class="vacancy-card__value">@@city</dd>
    </div>
    <div class="vacancy-card__meta-item">
      <dt class="vacancy-card__label">Тип занятости</dt>
      <dd class="vacancy-card__value">@@type</dd>
    </div>
  </dl>
  <a class="vacancy-card__link" href="@@href" aria-label="Подробнее о вакансии: @@title">Подробнее о вакансии</a>
</div>
