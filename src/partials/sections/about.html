<section class="about section-pad-bottom" id="about">
  <div class="about__container container">
    <div class="about__head">
      <div class="tag about__tag"><span class="tag__text">О компании</span></div>
      <div class="about__intro" data-reveal-stagger data-reveal-step="150">
        <h2 class="about__title">@@title</h2>
        <p class="about__text">@@text</p>
      </div>
    </div>

    @@if (stats) {
    <ul class="stats about__stats" data-reveal-stagger data-reveal-delay="300" data-reveal-step="80">
      <li class="stats__item">
        <span class="stats__value">15+</span>
        <span class="stats__label">лет опыта</span>
      </li>
      <li class="stats__item">
        <span class="stats__value">100+</span>
        <span class="stats__label">крупных клиентов</span>
      </li>
      <li class="stats__item">
        <span class="stats__value">120+</span>
        <span class="stats__label">успешных проектов</span>
      </li>
      <li class="stats__item">
        <span class="stats__value">40+</span>
        <span class="stats__label">специалистов</span>
      </li>
    </ul>
    }
  </div>
</section>
