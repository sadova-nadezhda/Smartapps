<div class="team-card">
  <span class="brackets" aria-hidden="true"></span>
  <img class="team-card__img" src="@@img" alt="@@name" width="602" height="640" loading="lazy">
  <div class="team-card__info">
    <h3 class="team-card__name">@@name</h3>
    <p class="team-card__role">@@role</p>
  </div>
</div>
