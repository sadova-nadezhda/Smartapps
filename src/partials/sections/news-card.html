<div class="news-card">
  <div class="news-card__inner">
    <div class="news-card__media">
      <img class="news-card__img" src="@@img" alt="" width="325" height="130" loading="lazy">
    </div>
    <div class="news-card__body">
      <div class="news-card__meta">
        <span class="news-card__category">@@category</span>
        <time class="news-card__date" datetime="@@datetime">@@date</time>
      </div>
      <h2 class="news-card__title">@@title</h2>
      <p class="news-card__text">@@text</p>
      <a class="news-card__link" href="@@href" aria-label="Читать подробнее: @@title">Читать подробнее</a>
    </div>
  </div>
</div>
