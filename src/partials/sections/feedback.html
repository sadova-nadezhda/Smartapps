<section class="feedback" id="feedback">
  <div class="feedback__container container">
    <div class="feedback__frame">
      <svg class="feedback__lines" aria-hidden="true" focusable="false">
        <path class="feedback__line feedback__line--outer" pathLength="1" />
        <path class="feedback__line feedback__line--inner" pathLength="1" />
        <path class="feedback__line feedback__line--inner" pathLength="1" />
        <path class="feedback__line feedback__line--inner" pathLength="1" />
        <path class="feedback__line feedback__line--inner" pathLength="1" />
        <path class="feedback__bar" />
        <circle class="feedback__dot" />
        <circle class="feedback__dot" />
        <circle class="feedback__dot" />
        <circle class="feedback__dot" />
      </svg>

      <h2 class="feedback__title" data-reveal>@@title</h2>
      <p class="feedback__text" data-reveal data-reveal-delay="150">@@text</p>
      <button class="button button--accent feedback__btn modal-btn" data-reveal data-reveal-delay="300" type="button" data-type="feedback">@@btn</button>
    </div>
  </div>
</section>
