<div class="modals">
  <div class="modal" data-type="feedback" role="dialog" aria-modal="true" aria-labelledby="modal-feedback-title">
    <div class="modal__body">
      <button class="modal__close" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M1 1l10 10M11 1 1 11" /></svg>
      </button>
      <h2 class="modal__title" id="modal-feedback-title">Оставьте заявку</h2>
      <form class="modal__form form">
        <label class="modal__field">
          <span class="modal__label">Имя<span class="modal__req">*</span></span>
          <input class="modal__input" type="text" name="name" placeholder="Введите ваше имя" autocomplete="name" required>
        </label>
        <label class="modal__field">
          <span class="modal__label">Номер телефона<span class="modal__req">*</span></span>
          <input class="modal__input" type="tel" name="phone" placeholder="+7 (___) ___-__-__" data-mask="+7 (___) ___-__-__" autocomplete="tel" required>
        </label>
        <label class="modal__field">
          <span class="modal__label">E-mail<span class="modal__req">*</span></span>
          <input class="modal__input" type="email" name="email" placeholder="mail@example.com" autocomplete="email" required>
        </label>
        <label class="modal__field">
          <span class="modal__label">Сообщение</span>
          <textarea class="modal__input modal__input--area" name="message" placeholder="Опишите вашу задачу или задайте вопрос"></textarea>
        </label>
        <label class="modal__check">
          <input class="modal__check-input" type="checkbox" name="consent" required>
          <span class="modal__check-box" aria-hidden="true"></span>
          <span class="modal__check-text">Я согласен (-на) на обработку персональных данных</span>
        </label>
        <input type="hidden" name="topic" data-modal-topic>
        <button class="button button--accent modal__btn" type="submit">Отправить заявку</button>
      </form>
    </div>
  </div>
</div>
